<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KvirtIO - Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(45deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .timestamp { font-size: 0.9rem; color: var(--text-muted); }
        .cluster-section { margin-bottom: 40px; }
        
        .cluster-header {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3b82f6;
        }
        
        .cluster-badge {
            background-color: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
        }
        
        .grid-hosts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;}
        .card-title { font-size: 1.1rem; font-weight: 600; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-offline { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .status-overloaded { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
        
        .metric-row { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;}
        .metric-label { color: var(--text-muted); }
        
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .table-title {
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.02);
            display: flex; justify-content: space-between;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
        th, td { padding: 12px 20px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 500; background-color: rgba(255, 255, 255, 0.01); }
        tr:last-child td { border-bottom: none; }
        
        .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-warning { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .badge-primary { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        
        #error-banner {
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>KvirtIO Virtualization Dashboard</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">Monitoraggio Enterprise</p>
        </div>
        <div class="timestamp">Ultimo aggiornamento: <strong id="last-update">...</strong></div>
    </header>

    <div id="error-banner"></div>

    <main id="dashboard-container">
        <!-- Rendered by JS -->
    </main>

    <script>
        const REFRESH_INTERVAL_MS = 15000;
        let clusterData = {};

        // Inizializza o restituisce i dati strutturati per il cluster e nodo
        function getClusterNode(clusterName, nodeName) {
            if (!clusterData[clusterName]) {
                clusterData[clusterName] = { nodes: {}, vms: [], cluster_status: null };
            }
            if (nodeName && !clusterData[clusterName].nodes[nodeName]) {
                clusterData[clusterName].nodes[nodeName] = {
                    host: null,
                    io: null,
                    network: null,
                    multipath: null
                };
            }
            return clusterData[clusterName];
        }

        async function fetchDashboardData() {
            try {
                const idxResp = await fetch('index.json?_t=' + new Date().getTime());
                if (!idxResp.ok) throw new Error('Impossibile caricare index.json');
                const index = await idxResp.json();
                
                document.getElementById('last-update').innerText = new Date().toLocaleString();
                document.getElementById('error-banner').style.display = 'none';
                
                clusterData = {}; // Reset dati ad ogni refresh

                // Fetcha tutti i file JSON menzionati nell'indice in parallelo
                const fetchPromises = index.files.map(async file => {
                    try {
                        const r = await fetch('data/' + file + '?_t=' + new Date().getTime());
                        if (r.ok) {
                            const data = await r.json();
                            return { file, data };
                        }
                    } catch (e) {
                        console.error('Error fetching', file, e);
                    }
                    return null;
                });

                const results = await Promise.all(fetchPromises);
                
                // Popola il dizionario clusterData
                for (const res of results) {
                    if (!res) continue;
                    const { file, data } = res;
                    const cluster = data.cluster_name;
                    
                    if (file.startsWith('host_')) {
                        getClusterNode(cluster, data.node).nodes[data.node].host = data;
                    } else if (file.startsWith('io_')) {
                        getClusterNode(cluster, data.node).nodes[data.node].io = data;
                    } else if (file.startsWith('network_')) {
                        getClusterNode(cluster, data.node).nodes[data.node].network = data;
                    } else if (file.startsWith('multipath_')) {
                        getClusterNode(cluster, data.node).nodes[data.node].multipath = data;
                    } else if (file.startsWith('cluster_')) {
                        getClusterNode(cluster, null).cluster_status = data;
                    } else if (file.startsWith('vm_')) {
                        getClusterNode(cluster, null).vms = data.vms;
                    }
                }

                renderDashboard();
                
            } catch (err) {
                console.error(err);
                const banner = document.getElementById('error-banner');
                banner.innerText = 'Errore di connessione o index.json mancante: ' + err.message;
                banner.style.display = 'block';
            }
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            if (Object.keys(clusterData).length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted)">Nessun dato cluster disponibile al momento.</p>';
                return;
            }

            // Ordina i cluster alfabeticamente
            const clusterNames = Object.keys(clusterData).sort();

            for (const clusterName of clusterNames) {
                const cData = clusterData[clusterName];
                
                let section = document.createElement('section');
                section.className = 'cluster-section';
                
                let header = document.createElement('div');
                header.className = 'cluster-header';
                
                let cStatusHtml = '';
                if (cData.cluster_status) {
                    let quorumStatus = cData.cluster_status.quorum === 'present' ? 'badge-success' : 'badge-danger';
                    cStatusHtml = `<span class="badge ${quorumStatus}">Quorum: ${cData.cluster_status.quorum.toUpperCase()}</span>`;
                }
                
                header.innerHTML = `<h2>Cluster: ${clusterName}</h2> ${cStatusHtml}`;
                section.appendChild(header);

                // --- HOST CARDS ---
                let gridHosts = document.createElement('div');
                gridHosts.className = 'grid-hosts';

                const nodeNames = Object.keys(cData.nodes).sort();
                for (const nodeName of nodeNames) {
                    const nData = cData.nodes[nodeName];
                    let isOverloaded = nData.host && nData.host.status_ha === 'overloaded';
                    let statusClass = isOverloaded ? 'status-overloaded' : (nData.host ? 'status-online' : 'status-offline');
                    let statusText = isOverloaded ? 'SOVRACCARICO' : (nData.host ? 'ONLINE' : 'OFFLINE');

                    let stealHtml = nData.host ? `${nData.host.metrics.steal_permille} ‰` : 'N/D';
                    let hpFreeHtml = nData.host ? `${nData.host.metrics.hugepages_free} / ${nData.host.metrics.hugepages_total}` : 'N/D';
                    
                    let ioAwaitHtml = nData.io ? `${nData.io.metrics.max_await_ms} ms` : 'N/D';
                    let ioUtilHtml = nData.io ? `${nData.io.metrics.max_util_percent} %` : 'N/D';

                    let netStatusHtml = nData.network ? `<span class="badge ${nData.network.status === 'healthy' ? 'badge-success' : 'badge-warning'}">${nData.network.status}</span>` : 'N/D';
                    
                    gridHosts.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title">${nodeName}</span>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 0.8rem; color: var(--text-muted);">${statusText}</span>
                                    <span class="status-dot ${statusClass}"></span>
                                </div>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">CPU Steal Time</span>
                                <span>${stealHtml}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">HugePages 1G (Libere/Tot)</span>
                                <span>${hpFreeHtml}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Max I/O LUN Await</span>
                                <span>${ioAwaitHtml}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Max LUN Queue Util</span>
                                <span>${ioUtilHtml}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Network Bond Status</span>
                                <span>${netStatusHtml}</span>
                            </div>
                        </div>
                    `;
                }
                section.appendChild(gridHosts);

                // --- VMS TABLE ---
                if (cData.vms && cData.vms.length > 0) {
                    let vmContainer = document.createElement('div');
                    vmContainer.className = 'table-container';
                    
                    let tableRows = '';
                    cData.vms.sort((a,b) => a.name.localeCompare(b.name)).forEach(vm => {
                        let lvBadge = vm.libvirt_state === 'running' ? 'badge-success' : (vm.libvirt_state === 'shut off' ? 'badge-danger' : 'badge-warning');
                        let pcmBadge = vm.pacemaker_status === 'Started' ? 'badge-success' : (vm.pacemaker_status === 'FAILED' ? 'badge-danger' : 'badge-warning');
                        
                        tableRows += `
                            <tr>
                                <td><strong>${vm.name}</strong></td>
                                <td><span class="badge ${lvBadge}">${vm.libvirt_state}</span></td>
                                <td><span class="badge ${pcmBadge}">${vm.pacemaker_status}</span></td>
                                <td>${vm.pacemaker_node}</td>
                            </tr>
                        `;
                    });

                    vmContainer.innerHTML = `
                        <div class="table-title">
                            <span>Macchine Virtuali (${cData.vms.length})</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome VM</th>
                                    <th>Stato Hypervisor</th>
                                    <th>Stato Pacemaker</th>
                                    <th>Nodo Corrente</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    `;
                    section.appendChild(vmContainer);
                }

                container.appendChild(section);
            }
        }

        // Boot
        fetchDashboardData();
        setInterval(fetchDashboardData, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
