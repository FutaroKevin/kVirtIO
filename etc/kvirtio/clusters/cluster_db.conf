# ==============================================================================
# File: /etc/kvirtio/clusters/cluster_db.conf
# Descrizione: Configurazione del cluster KvirtIO "cluster_db" (Database High-IOPS)
# Progetto: KvirtIO Virtualization
# ==============================================================================

CLUSTER_NAME="cluster_db"
NODES=("node1" "node2" "node3" "node4" "node5")
SSH_USER="kvirtwatch"

# Soglie specifiche per carichi DB transazionali
CPU_THRESHOLD=85
RAM_THRESHOLD=90
LATENCY_THRESHOLD=10.0
CONSECUTIVE_LIMIT=3
