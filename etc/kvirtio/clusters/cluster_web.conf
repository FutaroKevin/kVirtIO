# ==============================================================================
# File: /etc/kvirtio/clusters/cluster_web.conf
# Descrizione: Configurazione del cluster KvirtIO "cluster_web" (General Purpose / Web)
# Progetto: KvirtIO Virtualization
# ==============================================================================

CLUSTER_NAME="cluster_web"
NODES=("webnode1" "webnode2" "webnode3")
SSH_USER="kvirtwatch"

# Soglie specifiche per carichi web / general purpose
CPU_THRESHOLD=80
RAM_THRESHOLD=85
LATENCY_THRESHOLD=20.0
CONSECUTIVE_LIMIT=3
